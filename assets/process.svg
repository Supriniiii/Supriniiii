<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1000" height="250" fill="#0b0a14"/><text x="30" y="56" font-family="Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif" font-size="38" fill="#a78bfa">WORK PROCESS</text><line x1="130" y1="110" x2="870" y2="110" stroke="#3b2f6b" stroke-width="2" stroke-dasharray="6 6"/><circle cx="130" cy="110" r="22" fill="#15141f" stroke="#a78bfa" stroke-width="2"/><text x="130" y="115" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">01</text><text x="130" y="162" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#f2f1f8">UNDERSTAND</text><text y="168" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9a98b8"><tspan x="130" dy="15">Clarify the problem, users and</tspan><tspan x="130" dy="15">constraints.</tspan></text><circle cx="377" cy="110" r="22" fill="#15141f" stroke="#a78bfa" stroke-width="2"/><text x="377" y="115" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">02</text><text x="377" y="162" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#f2f1f8">DESIGN</text><text y="168" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9a98b8"><tspan x="377" dy="15">Sketch architecture, data flow</tspan><tspan x="377" dy="15">and APIs.</tspan></text><circle cx="624" cy="110" r="22" fill="#15141f" stroke="#a78bfa" stroke-width="2"/><text x="624" y="115" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">03</text><text x